overview: |
  Extra tests not present in the original spec.
tests:
  - name: Section - Receive Raw Section String 2
    desc: Lambdas used for sections should receive the raw section string.
    data:
      x: 'Error!'
      lambda: !code
        bash:    'if [[ "$1" == $''{{x}}{{^boolean}}\n^{{/boolean}}{{! comment }}'' ]]; then echo -n "yes"; else echo -n "${1}"; fi'
        # go:      'func(text string) string { if text == "{{x}}" { return "yes" } else { return "no" } }'
    template: "<{{#lambda}}{{x}}{{^boolean}}\n^{{/boolean}}{{! comment }}{{/lambda}}>"
    expected: "<yes>"

  - name: Escape html
    desc: HTML should be escaped in variables.
    data:
      x: '<&>"'''
    template: "{{x}}"
    expected: "&lt;&amp;&gt;&quot;&#39;"

  # Missing tests from the specifications (for truthy sections)

  - name: section with empty value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: ""
    template: "{{#x}}ok{{/x}}"
    expected: "ok"

  - name: section with null value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: null
    template: "{{#x}}ko{{/x}}"
    expected: ""

  - name: section with false value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: false
    template: "{{#x}}ko{{/x}}"
    expected: ""

  - name: section with 0 value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: 0
    template: "{{#x}}ok{{/x}}"
    expected: "ok"

  - name: section with false value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: False
    template: "{{#x}}ko{{/x}}"
    expected: ""

  - name: section with false string value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: "false"
    template: "{{#x}}ok{{/x}}"
    expected: "ok"

  - name: section with no value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: no
    template: "{{#x}}ok{{/x}}"
    expected: "ok"

  - name: section with empty array
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: []
    template: "{{#x}}ko{{/x}}"
    expected: ""

  - name: section with empty object
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: {}
    template: "{{#x}}ok{{/x}}"
    expected: "ok"

  - name: section with nested object
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x:
        y: {}
    template: "{{#x}}ok{{/x}}"
    expected: "ok"

  # Missing tests from the specifications (for inverted sections)

  - name: inverted with empty value
    desc: falsy is NOT a boolean false and NOT a null value and NOT an empty array
    data:
      x: ""
    template: "{{^x}}ko{{/x}}"
    expected: ""

  - name: inverted with null value
    desc: falsy is NOT a boolean false and NOT a null value and NOT an empty array
    data:
      x: null
    template: "{{^x}}ok{{/x}}"
    expected: "ok"

  - name: inverted with false value
    desc: falsy is NOT a boolean false and NOT a null value and NOT an empty array
    data:
      x: false
    template: "{{^x}}ok{{/x}}"
    expected: "ok"

  - name: inverted with 0 value
    desc: falsy is NOT a boolean false and NOT a null value and NOT an empty array
    data:
      x: 0
    template: "{{^x}}ko{{/x}}"
    expected: ""

  - name: inverted with false value
    desc: falsy is NOT a boolean false and NOT a null value and NOT an empty array
    data:
      x: False
    template: "{{^x}}ok{{/x}}"
    expected: "ok"

  - name: inverted with false string value
    desc: falsy is NOT a boolean false and NOT a null value and NOT an empty array
    data:
      x: "false"
    template: "{{^x}}ko{{/x}}"
    expected: ""

  - name: section with no value
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: no
    template: "{{^x}}ko{{/x}}"
    expected: ""

  - name: section with empty array
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: []
    template: "{{^x}}ok{{/x}}"
    expected: "ok"

  - name: section with empty object
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x: {}
    template: "{{^x}}ko{{/x}}"
    expected: ""

  - name: section with nested object
    desc: truthy is a boolean false, a null value or an empty array
    data:
      x:
        y: {}
    template: "{{^x}}ko{{/x}}"
    expected: ""

