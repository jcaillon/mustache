overview: |
  CLI options, usage errors, and version output.
tests:
  - name: Disable HTML escaping
    args: [--disable-html-escape, "-", template.mustache]
    stdin: "value: '<b>text</b>'\n"
    files:
      - path: template.mustache
        content: "{{value}}"
    stdout: <b>text</b>

  - name: Set custom delimiters
    args: [--set-delimiters, '<% %>', data.yml, template.mustache]
    files:
      - path: data.yml
        content: "name: Ada\n"
      - path: template.mustache
        content: <%name%>
    stdout: Ada

  - &output-separator
    name: Output separator between documents from stdin
    args: [--output-separator, "\n---\n", "-", template.mustache]
    stdin: "---\n---\nname: Ada\n---\n---\nname: Go\n---\nname: Julien\n---\n"
    files:
      - path: template.mustache
        content: "name: {{name}}"
    stdout: "name: Ada\n---\nname: Go\n---\nname: Julien"

  - <<: *output-separator
    name: Output separator between documents from a file
    args: [--output-separator, "\n---\n", data.yml, template.mustache]
    files:
      - path: data.yml
        content: "name: Ada\n---\nname: Go\n---\nname: Julien\n"
      - path: template.mustache
        content: "name: {{name}}"

  - <<: *output-separator
    name: Empty output separator preserves concatenation
    args: [--output-separator, "", "-", template.mustache]
    stdout: "name: Adaname: Goname: Julien"

  - <<: *output-separator
    name: Output separator is used literally
    args: [--output-separator, '\n{{name}}&\n', "-", template.mustache]
    stdout: 'name: Ada\n{{name}}&\nname: Go\n{{name}}&\nname: Julien'

  - <<: *output-separator
    name: Single document has no output separator
    stdin: "name: Ada\n"
    stdout: "name: Ada"

  - <<: *output-separator
    name: Empty rendered documents still have separators
    files:
      - path: template.mustache
        content: ""
    stdout: "\n---\n\n---\n"

  - name: Missing arguments show usage
    args: []
    exit_code: 2
    stderr_contains: ['Usage:']

  - name: Conflicting missing-tag options
    args: [--strict, --keep-missing-tags, data.yml, template.mustache]
    exit_code: 2
    stderr: "mustache: --keep-missing-tags and --strict cannot be used together\n"

  - name: Version
    args: [--version]
    stdout: "mustache dev\n"
