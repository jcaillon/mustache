overview: |
  --disable-lambda rejects invocation without executing Bash, regardless of the
  data source or tag type. Unused lambdas and skipped branches remain safe.
  YAML anchors share fixtures without adding special matrix logic to the runner.
tests:
  - &interpolation
    name: stdin/interpolation
    args: [--disable-lambda, "-", template.mustache]
    stdin: &input |
      value: safe
      enabled: true
      lambda: &lambda !code {bash: 'printf executed > "$MUSTACHE_TEST_LAMBDA_MARKER"; printf result'}
      alias: *lambda
    env:
      MUSTACHE_TEST_LAMBDA_MARKER: lambda-executed
    files:
      - &data
        path: data.yml
        content: *input
      - &partial
        path: partial.mustache
        content: "{{lambda}}"
      - path: template.mustache
        content: "{{lambda}}"
    exit_code: 1
    stderr_contains: ['lambda usage is disabled (--disable-lambda)']
    absent_files: [lambda-executed]

  - &unescaped
    <<: *interpolation
    name: stdin/unescaped
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{{lambda}}}"

  - &ampersand
    <<: *interpolation
    name: stdin/ampersand
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{&lambda}}"

  - &indented
    <<: *interpolation
    name: stdin/indented
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{|lambda}}"

  - &section
    <<: *interpolation
    name: stdin/section
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{#lambda}}text{{/lambda}}"

  - &inverted
    <<: *interpolation
    name: stdin/inverted
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{^lambda}}text{{/lambda}}"

  - &conditional
    <<: *interpolation
    name: stdin/conditional
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{?if lambda==result}}text{{?fi}}"

  - &elif
    <<: *interpolation
    name: stdin/elif
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{?if value==other}}text{{?elif lambda==result}}text{{?fi}}"

  - &nested
    <<: *interpolation
    name: stdin/nested
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{#enabled}}{{lambda}}{{/enabled}}"

  - &partial-invocation
    <<: *interpolation
    name: stdin/partial
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{>partial.mustache}}"

  - &alias
    <<: *interpolation
    name: stdin/alias
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{alias}}"

  - &unused
    <<: *interpolation
    name: stdin/unused
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{value}}"
    exit_code: 0
    stdout: safe
    stderr_contains: []

  - &skipped-section
    <<: *unused
    name: stdin/skipped section
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{#missing}}{{lambda}}{{/missing}}{{value}}"

  - &skipped-branch
    <<: *unused
    name: stdin/skipped branch
    files:
      - *data
      - *partial
      - path: template.mustache
        content: "{{?if value==safe}}{{value}}{{?elif lambda==result}}{{lambda}}{{?fi}}"

  - <<: *interpolation
    name: file/interpolation
    args: [--disable-lambda, data.yml, template.mustache]
    stdin: ""

  - <<: *unescaped
    name: file/unescaped
